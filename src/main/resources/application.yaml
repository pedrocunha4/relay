spring:
  application:
    name: relay

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/relay}
    username: ${DB_USERNAME:relay}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
