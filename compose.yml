services:
  postgres:
    image: postgres:17
    container_name: relay-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-relay}
      POSTGRES_USER: ${DB_USERNAME:-relay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}


    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - relay_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  relay_postgres_data:
